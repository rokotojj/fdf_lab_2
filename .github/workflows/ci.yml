name: CI/CD
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Версия релиза (тег)"
        required: true
        default: "v1.0"

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: ruff
        run: ruff check .
      - name: mypy
        run: mypy --strict fdf main.py
      - name: pytest
        run: pytest -q

  release:
    needs: checks
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - name: Архив с проектом
        run: git archive --format=zip --prefix=fdf-python/ -o "fdf-python-$TAG.zip" HEAD
      - name: Релиз
        run: |
          cat > notes.md <<'EOF'
          Лабораторная работа FdF: каркасная 3D-модель карты высот на Python (tkinter).

          - чтение и проверка карт `.fdf`, ошибки с номером строки и колонки;
          - изометрическая проекция, вписывание карты в окно, перерисовка при изменении размера;
          - бонусы: масштаб и сдвиг, высота рельефа, вид сверху, поворот, цвет с переходом на рёбрах, CI;
          - мышь: вращение левой кнопкой, сдвиг правой.

          Запуск: распаковать архив, `python main.py maps/42.fdf` (Python 3.12+).
          EOF
          gh release create "$TAG" "fdf-python-$TAG.zip" \
            --target "$GITHUB_SHA" --title "FdF $TAG" --notes-file notes.md
